name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    runs-on: ubuntu-latest
    steps:
      - name: Build verbose
        run: |
          exec > >(tee build.log) 2>&1
          set -x
          sudo apt-get update -y || echo "APT_UPDATE_FAILED"
          sudo apt-get install -y lld xz-utils || echo "APT_INSTALL_FAILED"
          which clang || sudo apt-get install -y clang || echo "NO_CLANG"
          clang --version
          python3 - > sdkurl.txt <<'PY'
          import json, re, urllib.request
          d = json.load(urllib.request.urlopen("https://api.github.com/repos/theos/sdks/contents/"))
          names = [x["name"] for x in d if re.match(r"iPhoneOS[\d.]+\.sdk\.tar\.xz$", x["name"])]
          names.sort(key=lambda n: [int(p) for p in re.findall(r"\d+", n)])
          print(names[-1])
          PY
          cat sdkurl.txt
          curl -sL -o sdk.tar.xz "https://github.com/theos/sdks/raw/master/$(cat sdkurl.txt)"
          ls -la sdk.tar.xz
          mkdir -p sdkroot
          tar -xf sdk.tar.xz -C sdkroot
          SDK="$(echo "$PWD"/sdkroot/*.sdk)"
          echo "SDK=$SDK"
          ls "$SDK" | head
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" src
          echo "CLONE_RC=$?"
          ls -la src
          mkdir -p out
          cd src
          clang -target arm64-apple-ios16.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "$SDK" -F"$SDK/System/Library/Frameworks" -L"$SDK/usr/lib" \
            -fuse-ld=lld -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o ../out/ClaudeUnlock.dylib \
            ClaudeUnlock.mm CUURLProtocol.mm CUPatch.mm
          echo "CLANG_RC=$?"
          cd ..
          file out/ClaudeUnlock.dylib
          strings -a out/ClaudeUnlock.dylib | grep -m1 'Frameworks/ClaudeUnlock.dylib' || echo "NO_INSTALL_NAME"
          ls -la out

      - name: Publish log and dylib
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="run-${{ github.run_number }}"
          gh release create "$TAG" --title "$TAG" --notes "build log" || true
          gh release upload "$TAG" build.log --clobber || true
          if [ -f out/ClaudeUnlock.dylib ]; then
            gh release upload "$TAG" out/ClaudeUnlock.dylib --clobber || true
          fi
          tail -n 40 build.log || true
