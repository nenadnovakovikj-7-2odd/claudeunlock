name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          set -euo pipefail
          mkdir -p out
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -miphoneos-version-min=16.0 -isysroot "$SDK" \
            -framework Foundation \
            -install_name @executable_path/Frameworks/ClaudeUnlock.dylib \
            -o out/ClaudeUnlock.dylib \
            ClaudeUnlock.mm CUURLProtocol.mm CUPatch.mm

      - name: Sign and verify
        run: |
          set -euo pipefail
          codesign -f -s - out/ClaudeUnlock.dylib
          lipo -info out/ClaudeUnlock.dylib
          otool -D out/ClaudeUnlock.dylib
          ls -la out

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            out/ClaudeUnlock.dylib \
            --title "build ${{ github.run_number }}" \
            --notes "ClaudeUnlock.dylib - arm64, inject into com.anthropic.claude"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUnlock-dylib
          path: out/ClaudeUnlock.dylib
