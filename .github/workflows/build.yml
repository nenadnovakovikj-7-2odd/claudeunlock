name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: make

      - name: Collect and verify
        run: |
          mkdir -p out
          find .theos -name 'ClaudeUnlock.dylib' -exec cp {} out/ \;
          test -f out/ClaudeUnlock.dylib
          lipo -info out/ClaudeUnlock.dylib
          ls -la out

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            out/ClaudeUnlock.dylib \
            --title "build ${{ github.run_number }}" \
            --notes "ClaudeUnlock.dylib - arm64, inject into com.anthropic.claude"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUnlock-dylib
          path: out/ClaudeUnlock.dylib
