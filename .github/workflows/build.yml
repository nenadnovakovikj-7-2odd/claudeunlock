name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    runs-on: macos-15
    steps:
      - name: Build verbose
        run: |
          exec > >(tee build.log) 2>&1
          set -x
          sw_vers
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          echo "SDK_RC=$?"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" src
          echo "CLONE_RC=$?"
          ls -la src
          mkdir -p out
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "USING_SDK=$SDK"
          cd src
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -miphoneos-version-min=16.0 -isysroot "$SDK" \
            -framework Foundation \
            -install_name @executable_path/Frameworks/ClaudeUnlock.dylib \
            -o ../out/ClaudeUnlock.dylib \
            ClaudeUnlock.mm CUURLProtocol.mm CUPatch.mm
          echo "CLANG_RC=$?"
          cd ..
          lipo -info out/ClaudeUnlock.dylib
          otool -D out/ClaudeUnlock.dylib
          ls -la out

      - name: Publish log and dylib
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="run-${{ github.run_number }}"
          gh release create "$TAG" --title "$TAG" --notes "build log" || true
          gh release upload "$TAG" build.log --clobber || true
          if [ -f out/ClaudeUnlock.dylib ]; then
            gh release upload "$TAG" out/ClaudeUnlock.dylib --clobber || true
          fi
          tail -n 40 build.log || true
