name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Compiler Toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lld xz-utils clang

      - name: Download and Extract iOS SDK
        run: |
          # Downloads a stable iOS 16.5 SDK tarball compatible with the Linux layout
          curl -sL -o sdk.tar.xz "https://github.com"
          mkdir -p sdkroot
          tar -xf sdk.tar.xz -C sdkroot
          # Save the dynamic SDK path to the global environment
          echo "SDK_PATH=$(echo $PWD/sdkroot/*.sdk)" >> $GITHUB_ENV

      - name: Compile iOS dylib
        run: |
          mkdir -p out
          clang -target arm64-apple-ios16.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "${{ env.SDK_PATH }}" \
            -F"${{ env.SDK_PATH }}/System/Library/Frameworks" \
            -L"${{ env.SDK_PATH }}/usr/lib" \
            -fuse-ld=lld \
            -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o out/ClaudeUnlock.dylib \
            ClaudeUnlock.mm CUURLProtocol.mm CUPatch.mm

      - name: Automatically Create Release & Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="run-${{ github.run_id }}"
          # Create the release draft/tag (ignores if already exists)
          gh release create "$TAG" --title "Build $TAG" --notes "Automated compilation asset." || true
          
          # Upload the dylib; if compilation failed earlier, this step won't run or will explicitly error
          gh release upload "$TAG" out/ClaudeUnlock.dylib --clobber
