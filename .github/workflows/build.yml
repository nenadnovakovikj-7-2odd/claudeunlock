name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile dylib Natively
        run: |
          mkdir -p out
          # Dynamically locate the native Xcode iOS SDK path
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          clang -target arm64-apple-ios16.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "$SDK_PATH" \
            -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o out/ClaudeUnlock.dylib \
            ClaudeUnlock.mm CUURLProtocol.mm CUPatch.mm

      - name: Publish Release Assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="run-${{ github.run_id }}"
          gh release create "$TAG" --title "$TAG" --notes "Automated Build" || true
          if [ -f out/ClaudeUnlock.dylib ]; then
            gh release upload "$TAG" out/ClaudeUnlock.dylib --clobber
          fi
