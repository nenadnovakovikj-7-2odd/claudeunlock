name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld xz-utils

      - name: Fetch iOS SDK Components
        run: |
          mkdir -p sdkroot out
          # Pull from a dedicated, raw binary SDK mirror to completely bypass Git LFS pointer locks
          curl -L -o sdk.tar.xz "https://sdks.website"
          tar -xf sdk.tar.xz -C sdkroot
          echo "SDK_PATH=$(echo "$PWD"/sdkroot/*.sdk)" >> $GITHUB_ENV

      - name: Run Clang Compiler
        run: |
          # Automatically inject the strict Objective-C++ type casts to fix line 222 and 285
          sed -i 's/d\.mutableBytes/(uint8_t *)d.mutableBytes/g' CUPatch.mm
          sed -i 's/_buf\.bytes/(const uint8_t *)_buf.bytes/g' CUPatch.mm
          
          clang -target arm64-apple-ios16.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "${{ env.SDK_PATH }}" \
            -F"${{ env.SDK_PATH }}/System/Library/Frameworks" \
            -L"${{ env.SDK_PATH }}/usr/lib" \
            -fuse-ld=lld -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o out/ClaudeUnlock.dylib \
            ./*.mm

      - name: Upload Binary Package to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          files: out/ClaudeUnlock.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
