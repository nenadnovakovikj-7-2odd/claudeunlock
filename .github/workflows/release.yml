name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      # This action handles getting the SDK cleanly without massive clones or manual extractions
      - name: Fetch iOS SDK
        uses: antoniomartinez/setup-ios-sdk@v1
        with:
          sdk-version: '16.5'

      - name: Run Clang Compiler
        run: |
          mkdir -p out
          # Locate the SDK path provided automatically by the action
          SDK_PATH="${{ env.IOS_SDK_PATH }}"
          
          clang -target arm64-apple-ios16.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "$SDK_PATH" \
            -F"$SDK_PATH/System/Library/Frameworks" \
            -L"$SDK_PATH/usr/lib" \
            -fuse-ld=lld -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o out/ClaudeUnlock.dylib \
            ./*.mm

      - name: Upload Binary Package to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          files: out/ClaudeUnlock.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
