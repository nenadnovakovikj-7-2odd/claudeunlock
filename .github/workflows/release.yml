name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your tweak code files
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Use the official Theos runner tool to set up the perfect iOS environment natively
      - name: Setup iOS SDK Environment
        uses: theos/setup-theos@v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Run Clang Compiler
        run: |
          mkdir -p out
          
          # Automatically inject the strict Objective-C++ type casts to fix line 222 and 285
          sed -i 's/d\.mutableBytes/(uint8_t *)d.mutableBytes/g' CUPatch.mm
          sed -i 's/_buf\.bytes/(const uint8_t *)_buf.bytes/g' CUPatch.mm
          
          # Use the verified, official SDK path automatically provided by the setup-theos tool
          SDK_PATH="${{ env.THEOS }}/sdks/iPhoneOS.sdk"
          
          clang -target arm64-apple-ios14.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "$SDK_PATH" \
            -F"$SDK_PATH/System/Library/Frameworks" \
            -L"$SDK_PATH/usr/lib" \
            -fuse-ld=lld -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o out/ClaudeUnlock.dylib \
            ./*.mm

      - name: Upload Binary Package to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          files: out/ClaudeUnlock.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
