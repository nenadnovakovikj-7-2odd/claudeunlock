name: release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Compile and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec > >(tee build.log) 2>&1
          set -x
          
          # Install dependencies
          sudo apt-get update -y || echo FAIL_APT
          sudo apt-get install -y lld xz-utils || echo FAIL_APT
          
          # Clone repository
          git clone --depth 1 "https://github.com{{ github.repository }}.git" src || echo FAIL_CLONE
          
          # Fetch and extract iOS SDK
          SDKNAME=$(curl -s https://github.com | grep -o 'iPhoneOS[0-9.]*\.sdk\.tar\.xz' | sort -V | tail -1)
          echo "SDKNAME=$SDKNAME"
          curl -sL -o sdk.tar.xz "https://github.com" || echo FAIL_CURL
          mkdir -p sdkroot out
          tar -xf sdk.tar.xz -C sdkroot || echo FAIL_TAR
          SDK="$(echo "$PWD"/sdkroot/*.sdk)"
          
          # Compile the dylib
          cd src || echo FAIL_CD
          clang -target arm64-apple-ios16.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "$SDK" -F"$SDK/System/Library/Frameworks" -L"$SDK/usr/lib" \
            -fuse-ld=lld -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o ../out/ClaudeUnlock.dylib \
            ClaudeUnlock.mm CUURLProtocol.mm CUPatch.mm || echo FAIL_CLANG
          cd ..
          
          # Check compiled file
          file out/ClaudeUnlock.dylib || true
          
          # Create Tag and Publish directly to GitHub Releases
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" --title "$TAG" --notes "ClaudeUnlock build" || true
          gh release upload "$TAG" build.log --clobber || true
          
          if [ -f out/ClaudeUnlock.dylib ]; then
            gh release upload "$TAG" out/ClaudeUnlock.dylib --clobber
          else
            echo "Error: ClaudeUnlock.dylib was not created."
            exit 1
          fi
