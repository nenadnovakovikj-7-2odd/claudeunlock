name: release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Compile and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          set -x
          
          # 1. Install dependencies
          sudo apt-get update -y
          sudo apt-get install -y lld xz-utils
          
          # 2. Clone repository
          git clone --depth 1 "https://github.com{{ github.repository }}.git" src
          
          # 3. Fetch and extract iOS SDK
          SDKNAME=$(curl -s https://github.com | grep -o 'iPhoneOS[0-9.]*\.sdk\.tar\.xz' | sort -V | tail -1)
          echo "Using SDK: $SDKNAME"
          curl -sL -o sdk.tar.xz "https://github.com"
          
          mkdir -p sdkroot out
          tar -xf sdk.tar.xz -C sdkroot
          SDK="$(echo "$PWD"/sdkroot/*.sdk)"
          
          # 4. Compile the dylib
          cd src
          clang -target arm64-apple-ios16.0 -dynamiclib -fobjc-arc \
            -fvisibility=hidden -DCU_DEBUG=1 \
            -isysroot "$SDK" -F"$SDK/System/Library/Frameworks" -L"$SDK/usr/lib" \
            -fuse-ld=lld -Wl,-install_name,@executable_path/Frameworks/ClaudeUnlock.dylib \
            -framework Foundation \
            -o ../out/ClaudeUnlock.dylib \
            ClaudeUnlock.mm CUURLProtocol.mm CUPatch.mm
          cd ..
          
          # 5. Verify the file exists before processing release
          if [ ! -f out/ClaudeUnlock.dylib ]; then
            echo "Error: ClaudeUnlock.dylib was not compiled successfully."
            exit 1
          fi
          
          # 6. Create Tag and Publish directly to GitHub Releases
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" --title "$TAG" --notes "ClaudeUnlock manual build"
          gh release upload "$TAG" out/ClaudeUnlock.dylib --clobber
